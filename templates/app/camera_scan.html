{% extends "app/base.html" %}{% block content %}<div class="card"><h1>Scan {{ quiz.title }}</h1><p>Keep the entire A4 sheet and all four black corner markers visible.</p><form id="scanForm">{% csrf_token %}<label>Student Name<input name="student_name" required></label><label>Student ID<input name="student_id"></label><div class="camera"><video id="video" autoplay playsinline></video><canvas id="canvas" hidden></canvas></div><button class="button" type="button" id="capture">Capture & Check</button><label class="button secondary file">Choose Image<input id="file" type="file" accept="image/*" capture="environment"></label><p id="status"></p></form></div><script>
const v=document.getElementById("video"),c=document.getElementById("canvas"),s=document.getElementById("status"),f=document.getElementById("scanForm");
async function camera(){try{v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:4032},height:{ideal:3024}},audio:false})}catch(e){s.textContent="Camera unavailable; use Choose Image."}}
async function send(blob){s.textContent="Scanning...";const d=new FormData(f);d.append("image",blob,"answer-sheet.jpg");const r=await fetch("{% url 'app:camera_submit' quiz.id %}",{method:"POST",body:d,headers:{"X-CSRFToken":document.querySelector("[name=csrfmiddlewaretoken]").value}});const x=await r.json();if(x.ok)location.href=x.redirect_url;else s.textContent=x.error||"Scan failed. Retake the photo."}
document.getElementById("capture").onclick=()=>{if(!v.videoWidth){s.textContent="Camera not ready.";return}c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);c.toBlob(send,"image/jpeg",.95)};
document.getElementById("file").onchange=e=>e.target.files[0]&&send(e.target.files[0]);camera();
</script>{% endblock %}
